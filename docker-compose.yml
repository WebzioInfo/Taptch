services:
  # 1. Redis In-Memory Cache & Message Broker
  redis:
    image: redis:7.2-alpine
    container_name: taptch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MinIO S3-Compatible Local Object Storage (Optional Dev Asset Mirror)
  minio:
    image: minio/minio:latest
    container_name: taptch-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MinIO Initialization (Create Public Media Bucket)
  minio-init:
    image: minio/mc:latest
    container_name: taptch-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/taptch-media;
      /usr/bin/mc anonymous set download myminio/taptch-media;
      exit 0;
      "

  # 4. Mailpit Transactional Email Testing UI
  mailpit:
    image: axllent/mailpit:latest
    container_name: taptch-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  redis_data:
  minio_data:
