<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatarClip)">
    <!-- Neutral portrait backdrop -->
    <rect width="200" height="200" fill="url(#bgGrad)"/>
    <!-- Shoulders & Coat -->
    <path d="M25 210 C35 155, 65 145, 100 145 C135 145, 165 155, 175 210 Z" fill="#1E293B"/>
    <!-- Collar & Shirt -->
    <path d="M85 145 L100 168 L115 145 Z" fill="#F8FAFC"/>
    <path d="M72 145 L85 170 L100 148 L78 145 Z" fill="#334155"/>
    <path d="M128 145 L115 170 L100 148 L122 145 Z" fill="#334155"/>
    <!-- Neck -->
    <path d="M86 112 C86 132, 114 132, 114 112 Z" fill="#D4A373"/>
    <!-- Head / Face -->
    <ellipse cx="100" cy="92" rx="36" ry="44" fill="#E0AC7E"/>
    <!-- Hair & Beard (Clean, professional) -->
    <path d="M62 82 C62 50, 78 40, 100 40 C122 40, 138 50, 138 82 C138 68, 128 52, 100 52 C72 52, 62 68, 62 82 Z" fill="#18181B"/>
    <!-- Neat modern side trim -->
    <path d="M63 78 C63 94, 66 104, 69 108 C68 96, 68 85, 67 78 Z" fill="#18181B"/>
    <path d="M137 78 C137 94, 134 104, 131 108 C132 96, 132 85, 133 78 Z" fill="#18181B"/>
    <!-- Ears -->
    <ellipse cx="63" cy="94" rx="5" ry="9" fill="#D4A373"/>
    <ellipse cx="137" cy="94" rx="5" ry="9" fill="#D4A373"/>
    <!-- Subtle neat trim beard -->
    <path d="M78 98 C78 126, 122 126, 122 98 C120 120, 80 120, 78 98 Z" fill="#27272A"/>
    <!-- Eyebrows -->
    <path d="M76 78 Q86 75 93 78" stroke="#18181B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M107 78 Q114 75 124 78" stroke="#18181B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Eyes -->
    <ellipse cx="85" cy="85" rx="3.5" ry="3" fill="#18181B"/>
    <ellipse cx="115" cy="85" rx="3.5" ry="3" fill="#18181B"/>
    <!-- Nose bridge -->
    <path d="M100 82 L98 94 L103 94" stroke="#C69566" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>

