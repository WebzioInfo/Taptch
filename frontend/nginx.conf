server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------------
    # Security Headers
    # ----------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ----------------------------------------------------------------
    # SPA Fallback — serve index.html for all client-side routes.
    # This is what makes /p/:uniqueKey and /b/:uniqueKey work when
    # a user navigates directly (NFC tap, shared link, page refresh).
    # Vite assets resolve via $uri exact-match first; unknown paths
    # fall through to index.html so React Router handles them.
    # ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------------
    # Long-term cache for Vite-hashed static assets
    # Vite appends a content hash to JS/CSS filenames so they are
    # safe to cache for a year.
    # ----------------------------------------------------------------
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----------------------------------------------------------------
    # Short-term cache for images and SVGs (not hash-stamped)
    # ----------------------------------------------------------------
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ----------------------------------------------------------------
    # PWA assets — no cache so browsers always fetch the latest
    # Service Worker and Web App Manifest.
    # ----------------------------------------------------------------
    location ~* (sw\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ----------------------------------------------------------------
    # Compression
    # ----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm;
}
