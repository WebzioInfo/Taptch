name: TAPTCH CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Lint & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Database Migrations & Seed (In-Memory / PGlite)
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run Architecture, Unit & Integration Tests
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build

